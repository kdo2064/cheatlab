name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build & Release Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Vite + Electron (no auto-publish)
        run: npm run build:win

      - name: Create GitHub Release & upload assets
        uses: softprops/action-gh-release@v2
        with:
          name: CheatLab ${{ github.ref_name }}
          body: |
            ## CheatLab ${{ github.ref_name }}

            ### Download
            | File | Info |
            |---|---|
            | `CheatLab Setup *.exe` | Installer — recommended |
            | `CheatLab-*-portable.exe` | Portable — no install needed |

            ### What's New
            See commit history for changes in this release.

            ---
            **by KDO** · [GitHub](https://github.com/kdo2064/cheatlab)
          draft: false
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          files: |
            dist-electron/*.exe
            dist-electron/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
